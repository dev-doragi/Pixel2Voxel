name: Release Pixel2Voxel

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test
        run: dotnet test -c Release --no-restore

      - name: Publish Windows x64
        run: >-
          dotnet publish src/PixelVoxel.App/PixelVoxel.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/Pixel2Voxel-win-x64

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/Pixel2Voxel-win-x64/* -DestinationPath artifacts/Pixel2Voxel-win-x64.zip

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          artifacts/Pixel2Voxel-win-x64.zip
          --title "Pixel2Voxel ${{ github.ref_name }}"
          --generate-notes
